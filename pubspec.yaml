name: donuts_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  
  firebase_core: ^3.15.2

  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  user_repository:
    path: packages/user_repository
  donut_repository:
    path: packages/donut_repository

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PoiretOne
      fonts:
        - asset: assets/fonts/PoiretOne-Regular.ttf

  assets:
    - assets/photos/
